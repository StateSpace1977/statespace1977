<div id="d3-tree-container" style="width: 100%; height: 600px; background: var(--card-bg, #1e1e1e); border-radius: 12px; border: 1px solid var(--card-border-color, #444); margin: 40px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; cursor: grab;">
</div>

<p style="text-align: center; color: var(--text-muted-color); font-size: 0.9rem;">
  <em>Tip: You can click the nodes to expand/collapse branches, and drag to pan around!</em>
</p>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(function initD3Tree() {
    try {
        const container = document.getElementById('d3-tree-container');
        if (!container) return;

        if (typeof d3 === 'undefined') {
            if (!document.getElementById('d3-cdn')) {
                var s = document.createElement('script');
                s.id = 'd3-cdn';
                s.src = 'https://d3js.org/d3.v7.min.js';
                document.head.appendChild(s);
            }
            setTimeout(initD3Tree, 100);
            return;
        }

        if (!window.roadmapData) {
            container.innerHTML = "<p style='color:red; padding:20px;'>Error: window.roadmapData is undefined</p>";
            return;
        }
        
        /*  Clear any ghost/duplicate SVG to prevent rendering issues across Turbolinks visits */
        container.innerHTML = "";
        
        const treeData = window.roadmapData;
        const width = container.clientWidth || 800;
        const height = container.clientHeight || 600;
        const margin = {top: 40, right: 180, bottom: 40, left: 180};

        /*  Create the SVG container */
        const svg = d3.select("#d3-tree-container")
            .append("svg")
            .attr("viewBox", `0 0 ${width} ${height}`)
            .attr("width", "100%")
            .attr("height", "100%");
            
        /*  Add a group for zooming/panning */
        const g = svg.append("g")
            .attr("transform", `translate(${margin.left},${height/2})`);

        /*  Enable Zoom & Pan */
        const zoom = d3.zoom()
            .scaleExtent([0.1, 3])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });
            
        /*  Initial transform to center the root vertically */
        svg.call(zoom).call(zoom.transform, d3.zoomIdentity.translate(margin.left, height/2));

        let i = 0;
        const duration = 750;
        const root = d3.hierarchy(treeData, d => d.children);
        root.x0 = height / 2;
        root.y0 = 0;

        /*  We use cluster for a tidy tree where leaves don't have to align at the exact same depth, but tree() spreads them beautifully */
        const treeMap = d3.tree().nodeSize([45, 250]); /*  Spacing between nodes */

        update(root);

        function update(source) {
            const treeDataLayout = treeMap(root);
            const nodes = treeDataLayout.descendants();
            const links = treeDataLayout.descendants().slice(1);

            /*  Normalize depth */
            nodes.forEach(d => { d.y = d.depth * 250; });

            /*  1. Nodes */
            const node = g.selectAll('g.node')
                .data(nodes, d => d.id || (d.id = ++i));

            const nodeEnter = node.enter().append('g')
                .attr('class', 'node')
                .attr("transform", d => `translate(${source.y0},${source.x0})`)
                .on('click', click);

            /*  Node Circles */
            nodeEnter.append('circle')
                .attr('r', 1e-6)
                .style("fill", d => d._children ? "#0284c7" : "var(--card-bg, #fff)")
                .style("stroke", "#0284c7")
                .style("stroke-width", "3px");

            /*  Node Labels */
            nodeEnter.append('text')
                .attr("dy", ".35em")
                .attr("x", d => d.children || d._children ? -13 : 13)
                .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                .text(d => d.data.name)
                .style("fill", "var(--heading-color, #333)")
                .style("font-size", d => d.depth === 0 ? "18px" : d.depth === 1 ? "15px" : "13px")
                .style("font-weight", d => d.depth < 2 ? "bold" : "500")
                .style("font-family", "inherit")
                .style("fill-opacity", 1e-6)
                .style("text-shadow", "0 1px 3px var(--card-bg, #fff)"); /*  better readability */

            /*  Node Update */
            const nodeUpdate = nodeEnter.merge(node);
            nodeUpdate.transition()
                .duration(duration)
                .attr("transform", d => `translate(${d.y},${d.x})`);

            nodeUpdate.select('circle').transition()
                .duration(duration)
                .attr('r', 8)
                .style("fill", d => d._children ? "#0284c7" : "var(--card-bg, #fff)")
                .style("stroke", "#0284c7")
                .attr('cursor', 'pointer');

            nodeUpdate.select('text').transition()
                .duration(duration)
                .style("fill-opacity", 1);

            /*  Node Exit */
            const nodeExit = node.exit().transition()
                .duration(duration)
                .attr("transform", d => `translate(${source.y},${source.x})`)
                .remove();

            nodeExit.select('circle')
                .attr('r', 1e-6);

            nodeExit.select('text')
                .style('fill-opacity', 1e-6);

            /*  2. Links */
            const link = g.selectAll('path.link')
                .data(links, d => d.id);

            const linkEnter = link.enter().insert('path', "g")
                .attr("class", "link")
                .style("fill", "none")
                .style("stroke", "var(--card-border-color, #cbd5e1)")
                .style("stroke-width", "2px")
                .attr('d', function(d){
                    const o = {x: source.x0, y: source.y0};
                    return diagonal(o, o);
                });

            const linkUpdate = linkEnter.merge(link);
            linkUpdate.transition()
                .duration(duration)
                .attr('d', d => diagonal(d, d.parent));

            const linkExit = link.exit().transition()
                .duration(duration)
                .attr('d', function(d) {
                    const o = {x: source.x, y: source.y};
                    return diagonal(o, o);
                })
                .remove();

            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });

            /*  Creates a curved (diagonal) path from parent to the child nodes */
            function diagonal(s, d) {
                return `M ${s.y} ${s.x}
                        C ${(s.y + d.y) / 2} ${s.x},
                          ${(s.y + d.y) / 2} ${d.x},
                          ${d.y} ${d.x}`;
            }

            /*  Toggle children on click */
            function click(event, d) {
                if (d.children) {
                    d._children = d.children;
                    d.children = null;
                } else {
                    d.children = d._children;
                    d._children = null;
                }
                update(d);
            }
        }
    } catch(e) {
        document.getElementById('d3-tree-container').innerHTML = "<p style='color:red; padding:20px;'>Error: " + e.message + "</p>";
    }
})();
</script>
