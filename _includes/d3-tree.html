<div id="d3-tree-container" style="width: 100%; height: 700px; margin: 40px 0; overflow: visible; cursor: grab;">
</div>

<p style="text-align: center; color: var(--text-muted-color); font-size: 0.9rem;">
  <em>Tip: You can click the nodes to expand/collapse branches, and drag to pan around!</em>
</p>

<div style="margin: 30px auto 10px auto; max-width: 800px; padding: 15px 20px; background-color: rgba(2, 132, 199, 0.05); border-left: 4px solid #0284c7; border-radius: 4px; font-size: 0.95rem; line-height: 1.5; color: var(--text-color, #333);">
  <strong style="color: #0284c7;"><i class="fas fa-info-circle"></i> Note:</strong> The roadmaps provided here are just for reference. It is strongly suggested to meet and ask someone who has already taken the course before making your final decision.
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(function initD3Tree() {
    try {
        const container = document.getElementById('d3-tree-container');
        if (!container) return;

        if (typeof d3 === 'undefined') {
            if (!document.getElementById('d3-cdn')) {
                var s = document.createElement('script');
                s.id = 'd3-cdn';
                s.src = 'https://d3js.org/d3.v7.min.js';
                document.head.appendChild(s);
            }
            setTimeout(initD3Tree, 100);
            return;
        }

        if (!window.roadmapData) {
            container.innerHTML = "<p style='color:red; padding:20px;'>Error: window.roadmapData is undefined</p>";
            return;
        }
        
        /*  Clear any ghost/duplicate SVG to prevent rendering issues across Turbolinks visits */
        container.innerHTML = "";
        
        const treeData = window.roadmapData;
        const width = container.clientWidth || 800;
        const height = container.clientHeight || 700;
        const margin = {top: 40, right: 350, bottom: 40, left: 100}; /* Increased right margin to prevent text cutoff */

        /*  Create the SVG container */
        const svg = d3.select("#d3-tree-container")
            .append("svg")
            .attr("viewBox", `0 0 ${width} ${height}`)
            .attr("width", "100%")
            .attr("height", "100%")
            .style("overflow", "visible");
            
        /*  Add a group for zooming/panning */
        const g = svg.append("g")
            .attr("transform", `translate(${margin.left},${height/2})`);

        /*  Enable Zoom & Pan */
        const zoom = d3.zoom()
            .scaleExtent([0.1, 3])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });
            
        /*  Initial transform to center the root vertically */
        svg.call(zoom).call(zoom.transform, d3.zoomIdentity.translate(margin.left, height/2));

        let i = 0;
        const duration = 750;
        const root = d3.hierarchy(treeData, d => d.children);
        root.x0 = height / 2;
        root.y0 = 0;

        /*  We use cluster for a tidy tree where leaves don't have to align at the exact same depth, but tree() spreads them beautifully */
        const treeMap = d3.tree().nodeSize([45, 250]); /*  Spacing between nodes */

        /*  Toggle children on click */
        function click(event, d) {
            if (d.children) {
                d._children = d.children;
                d.children = null;
            } else {
                d.children = d._children;
                d._children = null;
            }
            update(d);
        }

        /*  Collapse all nodes initially */
        function collapse(d) {
            if(d.children) {
                d._children = d.children;
                d._children.forEach(collapse);
                d.children = null;
            }
        }

        if (root.children) {
            root.children.forEach(collapse);
            /* Collapse root to start from a single node */
            root._children = root.children;
            root.children = null;
        }

        update(root);

        /* Timelapse growth animation */
        setTimeout(() => {
            if (root._children) {
                click(null, root); /* Expand domain node */
                setTimeout(() => {
                    if (root.children) {
                        root.children.forEach(semester => {
                            if (semester._children) {
                                semester.children = semester._children;
                                semester._children = null;
                            }
                        });
                        update(root);
                    }
                }, 1600); /* Wait for the first branches to finish growing! */
            }
        }, 400);

        function update(source) {
            const treeDataLayout = treeMap(root);
            const nodes = treeDataLayout.descendants();
            const links = treeDataLayout.descendants().slice(1);

            /*  Normalize depth */
            nodes.forEach(d => { d.y = d.depth * 250; });

            /*  1. Links */
            const link = g.selectAll('path.link')
                .data(links, d => d.id);

            const linkEnter = link.enter().insert('path', "g")
                .attr("class", "link")
                .style("fill", "none")
                .style("stroke", "var(--card-border-color, #cbd5e1)")
                .style("stroke-width", "2px")
                .attr('d', d => {
                    const o = {x: (d.parent ? d.parent.x0 : source.x0) || 0, y: (d.parent ? d.parent.y0 : source.y0) || 0};
                    return diagonal(o, d);
                });

            const linkUpdate = linkEnter.merge(link);
            
            /* Existing links morph to new position */
            linkUpdate.transition()
                .duration(duration)
                .attr('d', d => diagonal(d.parent, d));

            /* Entering links grow outwards */
            linkEnter.transition("grow")
                .duration(duration)
                .attrTween("stroke-dasharray", function() {
                    return function(t) {
                        const length = this.getTotalLength();
                        return length + " " + length;
                    };
                })
                .attrTween("stroke-dashoffset", function() {
                    return function(t) {
                        const length = this.getTotalLength();
                        return length * (1 - t);
                    };
                })
                .on("end", function() {
                    d3.select(this).style("stroke-dasharray", "none");
                });

            /* Exiting links retract inwards */
            const linkExit = link.exit();
            linkExit.style("stroke-dasharray", function() {
                const length = this.getTotalLength();
                return length + " " + length;
            })
            .transition()
                .duration(duration)
                .attrTween("stroke-dashoffset", function() {
                    return function(t) {
                        const length = this.getTotalLength();
                        return length * t;
                    };
                })
                .remove();

            /*  2. Nodes */
            const node = g.selectAll('g.node')
                .data(nodes, d => d.id || (d.id = ++i));

            const nodeEnter = node.enter().append('g')
                .attr('class', 'node')
                .attr("transform", d => `translate(${d.y},${d.x})`)
                .each(d => { d.rendered = false; })
                .on('click', click);

            /* Node Circles (hidden initially) */
            nodeEnter.append('circle')
                .attr('r', 1e-6)
                .style("fill", d => d._children ? "#0284c7" : "var(--card-bg, #fff)")
                .style("stroke", "#0284c7")
                .style("stroke-width", "3px");

            /* Text ClipPath for left-to-right reveal */
            nodeEnter.append("clipPath")
                .attr("id", d => "clip-" + d.id)
                .append("rect")
                .attr("class", "text-revealer")
                .attr("x", d => d.children || d._children ? -350 : 0)
                .attr("y", -30)
                .attr("height", 60)
                .attr("width", 0);

            /*  Node Labels */
            nodeEnter.append('text')
                .attr("clip-path", d => `url(#clip-${d.id})`)
                .attr("dy", ".35em")
                .attr("x", d => d.children || d._children ? -13 : 13)
                .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                .text(d => d.data.name)
                .style("fill", "var(--heading-color, #333)")
                .style("font-size", d => d.depth === 0 ? "18px" : d.depth === 1 ? "15px" : "13px")
                .style("font-weight", d => d.depth < 2 ? "bold" : "500")
                .style("font-family", "inherit")
                .style("text-shadow", "0 1px 3px var(--card-bg, #fff)");

            const nodeUpdate = nodeEnter.merge(node);
            
            /* Nodes slide to new position (if they moved) */
            nodeUpdate.transition()
                .duration(duration)
                .attr("transform", d => `translate(${d.y},${d.x})`);

            /* Pop in circles after branch finishes growing */
            nodeUpdate.select('circle').transition()
                .delay(d => (d.rendered || d.depth === 0) ? 0 : duration)
                .duration(400)
                .attr('r', 8)
                .style("fill", d => d._children ? "#0284c7" : "var(--card-bg, #fff)")
                .style("stroke", "#0284c7")
                .attr('cursor', 'pointer');

            /* Write text from left to right */
            nodeUpdate.select('.text-revealer').transition()
                .delay(d => (d.rendered || d.depth === 0) ? 0 : duration)
                .duration(600)
                .ease(d3.easeLinear)
                .attr("width", 350)
                .on("end", d => { d.rendered = true; });

            /* Exiting nodes fade out */
            const nodeExit = node.exit().transition()
                .duration(duration)
                .style("opacity", 0)
                .remove();

            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });

            /*  Creates a curved (diagonal) path from parent to the child nodes */
            function diagonal(s, d) {
                return `M ${s.y} ${s.x}
                        C ${(s.y + d.y) / 2} ${s.x},
                          ${(s.y + d.y) / 2} ${d.x},
                          ${d.y} ${d.x}`;
            }
        }
    } catch(e) {
        document.getElementById('d3-tree-container').innerHTML = "<p style='color:red; padding:20px;'>Error: " + e.message + "</p>";
    }
})();
</script>
